version: 1
frontend:
  phases:
    preBuild:
      commands:
        # vite-plugin-react-router-amplify-hosting requires Node.js v20 or later
        - nvm install 20
        - nvm use 20
        - corepack enable
        - pnpm install
    build:
      commands:
        - pnpm run build
        # for Amplify Hosting
        - cp -r build/server/assets .amplify-hosting/compute/default/
        - cp .env .amplify-hosting/compute/default/.env
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - "node_modules/**/*"
