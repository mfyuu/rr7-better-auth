version: 1
# vite-plugin-react-router-amplify-hosting requires Node.js v20 or later
env:
  variables:
    NODE_VERSION: 22
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm install
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - "node_modules/**/*"