# PostgreSQL Database Service
# Better Auth用のPostgreSQL 16データベースコンテナ
services:
  postgres:
    image: postgres:16
    container_name: rr7-better-auth-postgres
    environment:
      # データベース設定
      POSTGRES_DB: better_auth
      POSTGRES_USER: better_auth
      POSTGRES_PASSWORD: better_auth_password
    ports:
      # ホストポート:コンテナポート
      - "5432:5432"
    volumes:
      # データ永続化
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # ヘルスチェック設定
      test: ["CMD-SHELL", "pg_isready -U better_auth -d better_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

# ボリューム定義
volumes:
  postgres_data:
